<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitLab 個人 Issue 摘要報告</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
  :root {
    --color-bg: #f3f2f2;
    --color-surface: #eae9e9;
    --color-text: #201e1d;
    --color-accent: #ec3013;
    --color-divider: rgba(32, 30, 29, 0.4);
    --color-neutral-100: #f8f4f4;
    --color-neutral-200: #eae7e7;
    --color-neutral-300: #d7d3d3;
    --color-neutral-700: #605d5d;
    --color-neutral-800: #444141;
    --color-neutral-900: #2d2b2b;
    --color-accent-100: #fff2ef;
    --color-accent-700: #ae1800;
    --font-body: "Archivo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body), "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  h1, h2, h3 { font-family: var(--font-body), "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; font-weight: 800; }
  a { color: var(--color-text); text-decoration: none; }
  a:hover { color: var(--color-accent-700); text-decoration: underline; text-underline-offset: 3px; }

  .page { max-width: 1200px; margin: 0 auto; padding: 40px 24px 64px; }

  .head { display: grid; gap: 24px; padding-bottom: 24px; border-bottom: 2px solid var(--color-text); }
  .kicker { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .kicker i { width: 12px; height: 12px; background: var(--color-accent); display: block; }
  .title { margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }

  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-bottom: 1px solid var(--color-divider); }
  .meta > div { padding: 16px; display: grid; gap: 4px; border-left: 1px solid var(--color-divider); }
  .meta > div:first-child { padding-left: 0; border-left: 0; }
  .meta .k { font-size: 12px; color: var(--color-neutral-700); }
  .meta .v { font-size: 14px; font-weight: 600; }

  .config { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 12px 0; font-size: 13px; color: var(--color-neutral-800); border-bottom: 2px solid var(--color-text); }
  .config .k { color: var(--color-neutral-700); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); border-bottom: 2px solid var(--color-text); }
  .stats > div { padding: 24px; display: grid; gap: 6px; border-left: 1px solid var(--color-divider); }
  .stats > div:first-child { padding-left: 0; border-left: 0; }
  .stats .k { font-size: 13px; font-weight: 600; }
  .stats .n { font-size: 64px; line-height: 1; font-weight: 800; }
  .stats .n.accent { color: var(--color-accent); }
  .stats .sub { font-size: 13px; color: var(--color-neutral-700); }

  .sect { margin-top: 48px; }
  .sect-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 12px; }
  .sect-head.ruled { border-bottom: 2px solid var(--color-text); }
  .sect-head h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .sect-head .count { font-size: 13px; font-weight: 600; }

  ol.confirm { list-style: none; margin: 0; padding: 0; }
  ol.confirm > li { display: grid; grid-template-columns: 20px 48px minmax(0, 1fr); gap: 0 16px; padding: 20px 0; border-bottom: 1px solid var(--color-divider); }
  ol.confirm > li:last-child { border-bottom: 2px solid var(--color-text); }
  ol.confirm .idx { font-size: 28px; font-weight: 800; line-height: 1; }
  ol.confirm .idx.accent { color: var(--color-accent); }
  ol.confirm .body { display: grid; gap: 8px; }
  ol.confirm .line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--color-neutral-700); }
  ol.confirm .ref { font-weight: 600; color: var(--color-text); }
  ol.confirm .ttl { font-size: 17px; font-weight: 700; line-height: 1.4; }
  ol.confirm p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--color-neutral-900); text-wrap: pretty; }
  ol.confirm p strong { color: var(--color-accent-700); }
  ol.confirm > li.done .idx, ol.confirm > li.done .line1, ol.confirm > li.done .ref, ol.confirm > li.done .ttl, ol.confirm > li.done p, ol.confirm > li.done p strong { color: var(--color-neutral-700); }
  ol.confirm > li.done .ttl { text-decoration: line-through; }
  input.done { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--color-text); cursor: pointer; }
  .new { background: var(--color-accent); color: #fff; font-weight: 800; padding: 2px 8px; letter-spacing: 0.06em; }
  code { background: var(--color-neutral-200); padding: 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  .filters { position: sticky; top: 0; z-index: 20; background: var(--color-bg); border-top: 2px solid var(--color-text); border-bottom: 1px solid var(--color-divider); padding: 12px 0; display: grid; gap: 10px; }
  .filters input[type="text"] { font: inherit; min-height: 44px; font-size: 15px; padding: 8px 14px; background: #fff; border: 1px solid var(--color-divider); color: var(--color-text); width: 100%; }
  .filters input[type="text"]:focus-visible { border-color: var(--color-accent); outline: none; }
  .frow { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
  .fgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fgroup > .k { font-size: 12px; color: var(--color-neutral-700); margin-right: 4px; }
  .fgroup button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--color-divider); background: transparent; color: var(--color-text); cursor: pointer; display: flex; gap: 8px; }
  .fgroup button:hover { background: var(--color-accent-100); border-color: var(--color-accent); }
  .fgroup button[aria-pressed="true"] { font-weight: 600; border-color: var(--color-text); background: var(--color-text); color: var(--color-bg); }
  .fgroup button .c { color: var(--color-neutral-700); }
  .fgroup button[aria-pressed="true"] .c { color: var(--color-bg); }

  .empty-all { padding: 48px 0; font-size: 15px; color: var(--color-neutral-700); border-bottom: 1px solid var(--color-divider); }

  .list { border-bottom: 2px solid var(--color-text); }
  .list .row:first-child { border-top: 0; }

  .row { display: grid; grid-template-columns: 20px 64px minmax(0, 1fr) minmax(120px, auto); gap: 4px 16px; padding: 12px; border-top: 1px solid var(--color-neutral-300); align-items: start; }
  .row:hover { background: var(--color-neutral-100); }
  .row .iid { font-size: 13px; font-weight: 600; color: var(--color-neutral-700); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .row .mid { display: grid; gap: 6px; min-width: 0; }
  .row .mid a { font-size: 15px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
  .row .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 2px 8px; letter-spacing: 0.02em; white-space: nowrap; }
  .tag.r { background: var(--color-accent); color: #fff; font-weight: 600; }
  .tag.c { background: var(--color-neutral-300); color: var(--color-neutral-900); }
  .tag.a { border: 1px solid var(--color-text); color: var(--color-text); }
  .tag.s { background: var(--color-text); color: var(--color-bg); }
  .tag.l { background: var(--color-neutral-200); color: var(--color-neutral-800); }
  .tag.p { background: var(--color-neutral-200); color: var(--color-neutral-800); font-weight: 600; }
  .row .when { display: grid; justify-items: end; text-align: right; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .row .when .d { font-size: 13px; font-weight: 600; }
  .row .when .t { font-size: 12px; color: var(--color-neutral-700); }
  .row.recent .when .d { font-weight: 700; color: var(--color-accent-700); }
  .row.recent .when .t { color: var(--color-accent-700); }
  .row.done .iid, .row.done .mid a, .row.done .when .d, .row.done .when .t { color: var(--color-neutral-700); }
  .row.done .mid a { text-decoration: line-through; font-weight: 400; }

  footer { margin-top: 56px; padding-top: 16px; border-top: 2px solid var(--color-text); font-size: 13px; color: var(--color-neutral-700); }

  @media (max-width: 600px) {
    .page { padding: 24px 16px 48px; }
    .stats .n { font-size: 48px; }
    .row { grid-template-columns: 20px 56px minmax(0, 1fr); }
    .row .when { justify-items: start; text-align: left; grid-column: 3; }
  }
</style>
</head>
<body>
<div class="page" id="app"></div>

<script id="data" type="application/json">
{
  "date": "",
  "collectedAt": "",
  "timezone": "",
  "tzLabel": "",
  "host": "",
  "userId": "",
  "trackLabel": "",
  "filterRule": "",
  "unionLogic": "",
  "closedSince": "",
  "closedDays": 7,
  "closedBoundText": "",
  "hideEmptyProjects": false,
  "footer": "",
  "confirm": [],
  "projects": []
}
</script>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('data').textContent);
  var HOST = String(D.host || '').replace(/\/+$/, '') + '/';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  // 把原文的 `x` 轉成 <code>x</code>，其餘一律逃脫
  function rich(s) {
    return String(s == null ? '' : s).split('`').map(function (part, i) {
      return i % 2 ? '<code>' + esc(part) + '</code>' : esc(part);
    }).join('');
  }
  function issueUrl(path, iid, flags) {
    return HOST + path + (flags.indexOf('W') >= 0 ? '/-/work_items/' : '/-/issues/') + iid;
  }

  // 「我處理過了」狀態：localStorage（file:// 下同一瀏覽器、同一路徑才共用；不可用時退化成純顯示）
  var DONE_KEY = 'gitlab-brief:done';
  var DONE = {};
  function loadDone() {
    try {
      var raw = localStorage.getItem(DONE_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
    } catch (err) { return {}; }
  }
  function saveDone() {
    try { localStorage.setItem(DONE_KEY, JSON.stringify(DONE)); } catch (err) {}
  }
  function isDone(key) { return Object.prototype.hasOwnProperty.call(DONE, key); }
  function setDone(key, noteKey, on) {
    if (on) DONE[key] = { doneAt: new Date().toISOString(), seenNote: String(noteKey || '') };
    else delete DONE[key];
    saveDone();
  }
  // 有新的非本人回應（noteKey 與記錄的 seenNote 不同）→ 清掉該筆，回到未勾選
  function reconcileDone(key, noteKey) {
    var rec = DONE[key];
    if (rec && String(rec.seenNote == null ? '' : rec.seenNote) !== String(noteKey || '')) delete DONE[key];
  }

  function toRow(p, a, closed) {
    var iid = a[0], title = a[1], upd = String(a[2] || ''), f = String(a[3] || '');
    var noteKey = String(a[4] == null ? '' : a[4]);
    var parts = upd.split(' ');
    var r = {
      iid: iid, title: title, updated: upd, date: parts[0] || '', time: parts[1] || '', isClosed: closed,
      projKey: p.key, projPath: String(p.path || ''), projName: String(p.path || '').split('/').pop() || p.key,
      url: issueUrl(p.path, iid, f), key: p.path + '#' + iid, noteKey: noteKey,
      recent: f.indexOf('R') >= 0, author: f.indexOf('A') >= 0,
      assignee: f.indexOf('S') >= 0, label: f.indexOf('L') >= 0
    };
    r.hay = ['#' + iid, title, p.path, upd, closed ? 'closed' : 'opened',
      r.recent ? '24h 內回應' : '', r.author ? '我建立' : '',
      r.assignee ? '指派給我' : '', r.label ? '符合標籤' : ''].join(' ').toLowerCase();
    return r;
  }

  var DATA = (D.projects || []).map(function (p) {
    var seg = String(p.path || '').split('/');
    return {
      key: p.key, path: p.path, id: p.id, group: seg[0] || '', name: seg[1] || p.key,
      openRows: (p.open || []).map(function (a) { return toRow(p, a, false); }),
      closedRows: (p.closed || []).map(function (a) { return toRow(p, a, true); })
    };
  });
  // 全部專案的 open + closed 展平成單一清單：依更新時間由新到舊，同時刻以專案 path、iid 穩定排序
  var ROWS = [];
  DATA.forEach(function (p) { ROWS = ROWS.concat(p.openRows, p.closedRows); });
  ROWS.sort(function (a, b) {
    if (a.updated !== b.updated) return a.updated < b.updated ? 1 : -1;
    if (a.projPath !== b.projPath) return a.projPath < b.projPath ? -1 : 1;
    var ai = Number(a.iid), bi = Number(b.iid);
    if (!isNaN(ai) && !isNaN(bi)) return ai - bi;
    return String(a.iid) < String(b.iid) ? -1 : (String(a.iid) > String(b.iid) ? 1 : 0);
  });
  var PATH_BY_KEY = {};
  DATA.forEach(function (p) { PATH_BY_KEY[p.key] = p.path; });
  var CONFIRM = (D.confirm || []).map(function (it) {
    var ref = String(it.ref || ''), i = ref.lastIndexOf('#');
    var proj = i >= 0 ? ref.slice(0, i) : ref, iid = i >= 0 ? ref.slice(i + 1) : '';
    var path = PATH_BY_KEY[proj] || proj;
    var noteKey = String(it.noteKey == null ? '' : it.noteKey);
    return { it: it, key: path + '#' + iid, noteKey: noteKey };
  });
  DONE = loadDone();
  DATA.forEach(function (p) {
    p.openRows.concat(p.closedRows).forEach(function (r) { reconcileDone(r.key, r.noteKey); });
  });
  CONFIRM.forEach(function (c) { reconcileDone(c.key, c.noteKey); });
  saveDone();
  function countDone() {
    var n = 0;
    DATA.forEach(function (p) {
      p.openRows.concat(p.closedRows).forEach(function (r) { if (isDone(r.key)) n++; });
    });
    return n;
  }
  var TOTAL = DATA.reduce(function (n, p) { return n + p.openRows.length + p.closedRows.length; }, 0);
  var TOTAL_OPEN = DATA.reduce(function (n, p) { return n + p.openRows.length; }, 0);
  var TOTAL_CLOSED = DATA.reduce(function (n, p) { return n + p.closedRows.length; }, 0);
  var PROJ_WITH_ITEMS = DATA.filter(function (p) { return p.openRows.length + p.closedRows.length > 0; }).length;
  // 單一清單版面已無專案區塊；此選項保留讀取以相容舊資料，不再影響版面
  var HIDE_EMPTY = D.hideEmptyProjects === true;

  var state = { q: '', status: 'all', reason: 'all', project: 'all', hideDone: 'all' };

  // 分頁回到前景時決定要不要重載：先向本機 web server 問產出的版本（mtime），變了才重載；
  // 問不到（server 沒開、file:// 被擋、逾時）或載入時就沒拿到版本 → 退回「載入超過 RELOAD_AFTER_MS 就重載」。
  // 不管哪條路，距上次檢查不到 RELOAD_AFTER_MS 不再檢查（避免頻繁切換時連續 fetch）。
  // 重載前把篩選與捲動位置存進 sessionStorage，重載後還原並刪掉該 key。
  var VIEW_KEY = 'gitlab-brief:view';
  var RELOAD_AFTER_MS = 60 * 1000;
  var VERSION_URL = 'http://127.0.0.1:3351/api/version/gitlab-issues/0';
  var VERSION_TIMEOUT_MS = 1500;
  var loadedAt = Date.now();
  var loadedVersion = null;   // 載入時從 VERSION_URL 拿到的 mtime；拿不到就 null
  var loadedVersionLocal = '';
  var checking = false;
  function hm(d) {
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
  }
  var LOADED_HM = hm(new Date(loadedAt));
  function fetchVersion() {
    return new Promise(function (resolve) {
      var ctl = null, timer = null;
      try {
        if (typeof fetch !== 'function') return resolve(null);
        if (typeof AbortController === 'function') ctl = new AbortController();
        timer = setTimeout(function () { try { if (ctl) ctl.abort(); } catch (err) {} }, VERSION_TIMEOUT_MS);
        fetch(VERSION_URL, { cache: 'no-store', mode: 'cors', signal: ctl ? ctl.signal : undefined })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            clearTimeout(timer);
            resolve(j && typeof j.mtime === 'number' ? j : null);
          })
          .catch(function () { clearTimeout(timer); resolve(null); });
      } catch (err) { if (timer) clearTimeout(timer); resolve(null); }
    });
  }
  function loadView() {
    try {
      var raw = sessionStorage.getItem(VIEW_KEY);
      if (raw != null) sessionStorage.removeItem(VIEW_KEY);
      var v = raw ? JSON.parse(raw) : null;
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : null;
    } catch (err) { return null; }
  }
  function saveView() {
    try {
      sessionStorage.setItem(VIEW_KEY, JSON.stringify({ state: state, scrollY: window.scrollY || window.pageYOffset || 0 }));
    } catch (err) {}
  }
  var SAVED_VIEW = loadView();
  if (SAVED_VIEW && SAVED_VIEW.state && typeof SAVED_VIEW.state === 'object') {
    Object.keys(state).forEach(function (k) {
      if (typeof SAVED_VIEW.state[k] === 'string') state[k] = SAVED_VIEW.state[k];
    });
  }
  function doReload() {
    loadedAt = Date.now();
    saveView();
    location.reload();
  }
  function reloadIfStale() {
    if (document.visibilityState !== 'visible') return;
    if (checking) return;
    if (Date.now() - loadedAt < RELOAD_AFTER_MS) return;
    if (loadedVersion === null) { doReload(); return; }
    checking = true;
    fetchVersion().then(function (v) {
      checking = false;
      if (v === null) { doReload(); return; }          // 問不到 → 退回 60 秒規則（此刻已超過 60 秒）
      loadedAt = Date.now();                            // 版本相同：60 秒內不再檢查
      if (v.mtime !== loadedVersion) doReload();
    }).catch(function () { checking = false; doReload(); });
  }
  document.addEventListener('visibilitychange', reloadIfStale);
  window.addEventListener('focus', reloadIfStale);
  // 測試用：允許在頁內調整 loadedAt、讀版本
  window.gitlabBrief = {
    setLoadedAt: function (t) { loadedAt = Number(t) || Date.now(); },
    getLoadedAt: function () { return loadedAt; },
    getLoadedVersion: function () { return loadedVersion; },
    check: reloadIfStale
  };

  function match(r) {
    if (state.project !== 'all' && r.projKey !== state.project) return false;
    if (state.status !== 'all' && state.status !== (r.isClosed ? 'closed' : 'open')) return false;
    if (state.reason !== 'all' && !r[state.reason]) return false;
    if (state.hideDone === 'on' && isDone(r.key)) return false;
    var qq = state.q.toLowerCase().trim();
    return !qq || r.hay.indexOf(qq) >= 0;
  }

  function compute() {
    var filtering = !!(state.q.trim() || state.status !== 'all' || state.reason !== 'all' || state.project !== 'all' || state.hideDone !== 'all');
    var rows = ROWS.filter(match);
    return { filtering: filtering, shown: rows.length, rows: rows };
  }

  function btn(key, val, label, count) {
    var active = state[key] === val;
    return '<button type="button" data-key="' + key + '" data-val="' + esc(val) + '" aria-pressed="' +
      (active ? 'true' : 'false') + '"><span>' + esc(label) + '</span>' +
      (count == null ? '' : '<span class="c">' + count + '</span>') + '</button>';
  }

  function rowHtml(r) {
    var tags = '';
    if (r.recent) tags += '<span class="tag r">24h 內回應</span>';
    if (r.isClosed) tags += '<span class="tag c">closed</span>';
    if (r.author) tags += '<span class="tag a">我建立</span>';
    if (r.assignee) tags += '<span class="tag s">指派給我</span>';
    if (r.label) tags += '<span class="tag l">符合標籤</span>';
    tags += '<span class="tag p">' + esc(r.projName) + '</span>';
    var done = isDone(r.key);
    return '<div class="row' + (r.recent ? ' recent' : '') + (done ? ' done' : '') + '">' +
      '<input type="checkbox" class="done" data-k="' + esc(r.key) + '" data-n="' + esc(r.noteKey) + '"' + (done ? ' checked' : '') + ' aria-label="我處理過了">' +
      '<span class="iid">#' + esc(r.iid) + '</span>' +
      '<div class="mid"><a href="' + esc(r.url) + '" target="_blank" rel="noopener" data-k="' + esc(r.key) + '" data-n="' + esc(r.noteKey) + '">' + esc(r.title) + '</a>' +
      '<div class="tags">' + tags + '</div></div>' +
      '<div class="when"><span class="d">' + esc(r.date) + '</span><span class="t">' + esc(r.time) + '</span></div>' +
      '</div>';
  }

  function render() {
    var c = compute();
    var h = '';

    h += '<header class="head"><div class="kicker"><i></i><span>GitLab Issue Digest · ' + esc(D.date) + '</span></div>' +
      '<h1 class="title">GitLab 個人相關 Issue 摘要報告</h1></header>';

    h += '<section class="meta">' +
      '<div><span class="k">收集時間</span><span class="v">' + esc(D.collectedAt) + '</span><span class="k" id="loaded-hm">頁面載入 ' + esc(LOADED_HM) + (loadedVersionLocal ? ' · 檔案 ' + esc(loadedVersionLocal) : '') + '</span></div>' +
      '<div><span class="k">已結案下界</span><span class="v">' + esc(D.closedBoundText || (D.closedSince + '（近 ' + D.closedDays + ' 天）')) + '</span></div>' +
      '<div><span class="k">篩選規則</span><span class="v">' + esc(D.filterRule) + '</span></div>' +
      '</section>';

    h += '<section class="config">' +
      '<span><span class="k">GitLab 主機</span>　' + esc(D.host) + '</span>' +
      '<span><span class="k">時區</span>　' + esc(D.timezone) + '</span>' +
      '<span><span class="k">使用者 ID</span>　' + esc(D.userId) + '</span>' +
      '<span><span class="k">追蹤標籤</span>　' + esc(D.trackLabel) + '</span>' +
      '<span><span class="k">聯集邏輯</span>　' + esc(D.unionLogic) + '</span>' +
      '</section>';

    var confirm = D.confirm || [];
    h += '<section class="stats">' +
      '<div><span class="k">未結案 Issues</span><span class="n accent">' + TOTAL_OPEN + '</span>' +
      '<span class="sub">涵蓋 ' + PROJ_WITH_ITEMS + ' 個專案</span></div>' +
      '<div><span class="k">近期已結案 (' + esc(D.closedDays) + '天內)</span><span class="n">' + TOTAL_CLOSED + '</span>' +
      '<span class="sub">更新於 ' + esc(String(D.closedSince || '').slice(5)) + ' 之後</span></div>' +
      '<div><span class="k">待確認事項</span><span class="n">' + confirm.length + '</span>' +
      '<span class="sub">需本人回覆或決策</span></div>' +
      '</section>';

    if (confirm.length) {
      h += '<section class="sect"><div class="sect-head ruled"><h2>待我確認重點</h2>' +
        '<span class="count">' + confirm.length + ' 筆</span></div><ol class="confirm">';
      CONFIRM.forEach(function (c, i) {
        var it = c.it;
        var done = isDone(c.key);
        var isNew = it['new'] === true;
        var kind = it.kind || '';
        var text = it.text || '';
        if (!kind) {
          var m = /^([^：]{1,12})：([\s\S]*)$/.exec(text);
          if (m) { kind = m[1]; text = m[2]; }
        }
        h += '<li' + (done ? ' class="done"' : '') + '>' +
          '<input type="checkbox" class="done" data-k="' + esc(c.key) + '" data-n="' + esc(c.noteKey) + '"' + (done ? ' checked' : '') + ' aria-label="我處理過了">' +
          '<span class="idx' + (isNew ? ' accent' : '') + '">' + (i < 9 ? '0' : '') + (i + 1) + '</span>' +
          '<div class="body"><div class="line1">' +
          (isNew ? '<span class="new">NEW</span>' : '') +
          '<span class="ref">' + esc(it.ref) + '</span>' +
          '<span>更新時間：' + esc(it.updated) + '</span></div>' +
          '<a class="ttl" href="' + esc(it.url) + '" target="_blank" rel="noopener" data-k="' + esc(c.key) + '" data-n="' + esc(c.noteKey) + '">' + esc(it.title) + '</a>' +
          '<p>' + (kind ? '<strong>' + esc(kind) + '：</strong>' : '') + rich(text) + '</p>' +
          '</div></li>';
      });
      h += '</ol></section>';
    }

    h += '<section class="sect"><div class="sect-head"><h2>全部 Issues</h2>' +
      '<span class="count">顯示 ' + c.shown + ' / ' + TOTAL + ' 筆 · 已處理 ' + countDone() + '</span></div>';

    h += '<div class="filters">' +
      '<input type="text" id="q" placeholder="搜尋 Issue 標題、編號、專案、符合原因…" value="' + esc(state.q) + '">' +
      '<div class="frow">' +
      '<div class="fgroup"><span class="k">狀態</span>' +
      btn('status', 'all', '全部') + btn('status', 'open', '未結案') + btn('status', 'closed', '近期已結案') +
      '</div>' +
      '<div class="fgroup"><span class="k">符合原因</span>' +
      btn('reason', 'all', '全部') + btn('reason', 'recent', '24h 內回應') + btn('reason', 'author', '我建立') +
      btn('reason', 'assignee', '指派給我') + btn('reason', 'label', '符合標籤') +
      '</div>' +
      '<div class="fgroup"><span class="k">已處理</span>' + btn('hideDone', 'on', '隱藏已處理') + '</div></div>' +
      '<div class="fgroup"><span class="k">專案</span>' +
      btn('project', 'all', '全部專案', TOTAL) +
      DATA.map(function (p) { return btn('project', p.key, p.name, p.openRows.length + p.closedRows.length); }).join('') +
      '</div></div>';

    if (c.shown === 0) {
      h += '<div class="empty-all">沒有符合目前篩選條件的 Issue。</div>';
    } else {
      h += '<div class="list">' + c.rows.map(rowHtml).join('') + '</div>';
    }

    h += '</section><footer>' + esc(D.footer) + '</footer>';

    var app = document.getElementById('app');
    app.innerHTML = h;

    var input = document.getElementById('q');
    input.addEventListener('input', function (e) {
      state.q = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var ni = document.getElementById('q');
      ni.focus();
      try { ni.setSelectionRange(pos, pos); } catch (err) {}
    });
    app.querySelectorAll('.fgroup button').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-key'), v = b.getAttribute('data-val');
        state[k] = (state[k] === v && v !== 'all') ? 'all' : v;
        render();
      });
    });
    app.querySelectorAll('input.done').forEach(function (cb) {
      cb.addEventListener('change', function () {
        setDone(cb.getAttribute('data-k'), cb.getAttribute('data-n'), cb.checked);
        render();
      });
    });
    app.querySelectorAll('a[data-k]').forEach(function (a) {
      a.addEventListener('click', function () {
        setDone(a.getAttribute('data-k'), a.getAttribute('data-n'), true);
        setTimeout(render, 0);
      });
    });
  }

  document.title = 'GitLab 個人 Issue 摘要報告' + (D.date ? ' (' + D.date + ')' : '');
  render();
  // 載入時問一次版本；拿到就記下 mtime，並在頁首補「· 檔案 HH:mm」
  fetchVersion().then(function (v) {
    if (v === null) return;
    loadedVersion = v.mtime;
    var m = /(\d{2}):(\d{2})(?::\d{2})?$/.exec(String(v.mtimeLocal || ''));
    loadedVersionLocal = m ? m[1] + ':' + m[2] : '';
    var el = document.getElementById('loaded-hm');
    if (el && loadedVersionLocal) el.textContent = '頁面載入 ' + LOADED_HM + ' · 檔案 ' + loadedVersionLocal;
  }).catch(function () {});
  if (SAVED_VIEW && typeof SAVED_VIEW.scrollY === 'number' && SAVED_VIEW.scrollY > 0) {
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (err) {}
    var restoreY = SAVED_VIEW.scrollY;
    window.scrollTo(0, restoreY);
    window.requestAnimationFrame(function () { window.scrollTo(0, restoreY); });
  }
})();
</script>
</body>
</html>
