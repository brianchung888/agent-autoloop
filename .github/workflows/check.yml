name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR makes its run pointless. On main a run covers everything before it, so it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # These jobs stay required on main, so a docs change runs them too and all it gets them to do is the one step
      # below.
      - id: scope
        run: sh scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      # Node whatever the scope said, because the step after this one runs whatever the scope said. The rest of the job
      # wants it anyway, so this is one setup for both rather than a second one further down.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The one test a docs-only change is the reason for: a control character in a tracked file, or a file that
      # stopped decoding as UTF-8, is exactly what a docs commit brings in, and every step below this one is gated on
      # the scope not being docs. It reads `git ls-files` and the files, so it needs no dependencies and no `npm ci`:
      # a quarter of a second, and scope=docs stops meaning nothing was looked at. tests/build-binary.test.ts keeps
      # this step off the gate.
      - run: node --disable-warning=ExperimentalWarning --env-file=tests/lang.env --test tests/tracked-text.test.ts
      - if: steps.scope.outputs.scope != 'docs'
        run: npm ci
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run format:check
      # Before the typecheck, because what it writes is typechecked too: `build/` is in tsconfig's include, and a
      # generated module that does not compile is a packaged build that does not build.
      #
      # The list is not in the version control, so there is no stale one to catch here — writing it and then comparing
      # cannot fail on its own. What the pair does check is the generator: that it runs at all, that it is a function of
      # `plugins/` alone and writes the same thing twice, and that every path it wrote is a file. The difference it
      # exists for — a plugin added to `plugins/` and missing from the list — is caught by the test that scans the
      # folder itself (tests/plugin-loaders.test.ts), on a machine where this step has already run.
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run build:registry && npm run build:registry -- --check
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run typecheck
      - if: steps.scope.outputs.scope == 'normal' || steps.scope.outputs.scope == 'kernel'
        run: npm run test:quick
      - if: steps.scope.outputs.scope == 'kernel'
        run: npm run test:sim
      - if: steps.scope.outputs.scope == 'full'
        run: npm test
      - if: steps.scope.outputs.scope != 'docs'
        run: sh scripts/install-smoke.sh

  # Windows, where the tests that write a `#!/bin/sh` stand-in cannot run at all: those say so themselves, one skip at a
  # time, and this job prints how many of them there were so a silent collapse to nothing shows up. What it does check is
  # the whole of what Windows adds — tests/platform-*.test.ts, with real processes, a real scheduled task and real access
  # lists — and the first hour someone has with it, from install.ps1 to uninstall.
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The runner has bash, and the scope script is the same decision on every platform.
      - id: scope
        shell: bash
        run: sh scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.scope != 'docs'
        run: npm ci
      # The generated list first, for the same reason as in the job above: it is part of what the typecheck covers.
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run build:registry
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run typecheck
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run format:check
      # A floor, not a count: it may only go up. Nothing being run is the failure this guards against — so a skipped
      # case may not be counted towards it. TAP says `ok` of one too, with `# SKIP` after it, which is the whole point:
      # every one of these could turn into a skip and the number would not move.
      - if: steps.scope.outputs.scope != 'docs'
        shell: bash
        run: |
          node --disable-warning=ExperimentalWarning --env-file=tests/lang.env --test --test-reporter=tap tests/platform-*.test.ts | tee platform.tap
          passed=$(grep '^ok ' platform.tap | grep -vc 'SKIP' || true)
          echo "platform tests passed: $passed, skipped: $(grep '^ok ' platform.tap | grep -c 'SKIP' || true)"
          [ "$passed" -ge 30 ] || { echo "too few platform tests ran: $passed"; exit 1; }
      - if: steps.scope.outputs.scope == 'normal' || steps.scope.outputs.scope == 'kernel'
        shell: bash
        run: |
          npm run test:quick | tee quick.tap
          echo "skipped on this platform: $(grep -c 'SKIP' quick.tap || true)"
      - if: steps.scope.outputs.scope == 'full'
        run: npm test
      - if: steps.scope.outputs.scope != 'docs'
        run: pwsh -NoProfile -File scripts/install-smoke.ps1
